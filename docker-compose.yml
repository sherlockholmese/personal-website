services:
  personal-website:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_HOSTNAME: ${TURNSTILE_HOSTNAME:-}
      TRUST_CLOUDFLARE_IP_HEADER: ${TRUST_CLOUDFLARE_IP_HEADER:-false}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      DOWNLOAD_ACCESS_SECRET: ${DOWNLOAD_ACCESS_SECRET:-}
    restart: unless-stopped
